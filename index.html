<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06182b">
<meta name="description" content="Volleyball 2D — voli aksi tampak samping di browser.">
<title>Volleyball 2D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volleyball 2D">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wadah">
  <canvas id="kanvas" aria-label="Volleyball 2D"></canvas>

  <div id="putar" class="tersembunyi">
    <div class="kartu-putar">📱↻<p>Putar HP kamu ke mode landscape</p></div>
  </div>

  <div id="sentuh" class="tersembunyi">
    <div id="joy" aria-label="Joystick gerak"><div id="joy-knob"></div></div>
    <div id="tombol-kanan">
      <button type="button" data-aksi="lompat">Lompat</button>
      <button type="button" data-aksi="smash">Smash</button>
      <button type="button" data-aksi="terima" id="btn-terima">Terima</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
